name: sentinel

# Runs daily, but daemon/sentinel.js --if-due only does real work once 14 days have passed
# since registry/pulse.json "lastRun". (cron cannot express "every 14 days" exactly; this can.)
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the 14 days have not passed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run sentinel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node daemon/sentinel.js --once --force
          else
            node daemon/sentinel.js --once --if-due
          fi
      - name: Commit new model drafts
        run: |
          git config user.name "promptc-sentinel"
          git config user.email "sentinel@users.noreply.github.com"
          git add registry/signals.json registry/pulse.json
          git diff --cached --quiet || git commit -m "sentinel: model registry check" && git push
